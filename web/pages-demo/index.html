<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse live K45movies providers and TMDB titles with a browser-local watchlist.">
  <meta name="theme-color" content="#101115">
  <title>K45movies</title>
  <link rel="icon" href="./brand.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./hls.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header>
    <a class="brand" href="#browse" aria-label="K45movies home"><img src="./brand.png" alt="" width="36" height="36"><span>K45<span>movies</span></span></a>
    <nav aria-label="Main navigation">
      <a href="#browse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3z M9 20v-6h6v6"/></svg>Browse</a>
      <a href="#providers"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Providers</a>
      <a href="#watchlist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="2.5"/><path d="M6.5 18a5.5 5.5 0 0 1 11 0"/></svg>My space</a>
      <a href="#settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg>Settings</a>
    </nav>
    <button id="search-open" type="button" aria-keyshortcuts="Control+K Meta+K" aria-label="Search titles"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span>Search</span><kbd>Ctrl K</kbd></button>
  </header>
  <main id="content" tabindex="-1"></main>
  <footer><strong>K45movies</strong><a href="https://github.com/Khiladi45/K45movies/tree/feat/website/web/pages-demo">Source code</a></footer>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <form id="search-form" role="search">
      <div class="bar"><h2 id="search-title">Search titles</h2><button type="button" id="search-close" aria-label="Close search">×</button></div>
      <label for="query">Movie or series title</label>
      <input id="query" type="search" placeholder="Enter a title" autocomplete="off" maxlength="120" minlength="2" required>
      <button class="primary" type="submit">Search</button>
    </form>
  </dialog>
  <template id="card">
    <li><a class="card"><div class="card-art"><img alt="" width="320" height="480" loading="lazy"><span aria-hidden="true">▶</span></div><strong></strong><small></small></a></li>
  </template>
</body>
</html>
